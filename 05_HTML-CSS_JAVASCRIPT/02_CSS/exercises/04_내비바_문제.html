<!DOCTYPE html>

    <title>[문제] 내비게이션 바</title>

<!--
================================================================================
 04. 내비게이션 바 - flex와 position

  [목표]
    - display: flex로 요소를 가로로 배치하고 정렬할 수 있다.
    - justify-content와 align-items의 차이를 구분해서 쓸 수 있다.
    - gap으로 아이템 사이 간격을 줄 수 있다.
    - flex: 1로 남는 공간을 차지하게 할 수 있다.
    - position: relative와 absolute를 짝으로 써서 배지를 배치할 수 있다.
    - position: sticky로 헤더를 고정할 수 있다.

  [유형]: 구현형

  ────────────────────────────────────────────────────────────────────────────
  [먼저 할 것] Flexbox Froggy 게임 (https://flexboxfroggy.com/#ko)

  이 문제를 풀기 전에 게임을 먼저 한다. 24단계이고 15~20분이면 끝난다.
  속성을 손으로 익히는 것은 게임이 훨씬 빠르다.
  이 문제는 "게임에서 배운 속성으로 실제 화면을 조립하는" 연습이다.
  ────────────────────────────────────────────────────────────────────────────

  [완성 예시]

   ┌──────────────────────────────────────────────────────┐
   │ MyApp              홈  소개  문의        (종)③        │  <- 스크롤해도 고정
   ├───────────┬──────────────────────────────────────────┤
   │  사이드바   │  본문                                     │
   │  (200px   │  (남는 공간 전부)                          │
   │   고정)    │                                          │
   └───────────┴──────────────────────────────────────────┘

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - flex에서 가장 헷갈리는 것은 justify-content와 align-items의 방향이다.
        flex-direction이 row일 때 justify는 가로, align은 세로라는 것을 먼저 정리한다.
      - 배지는 "기준점(relative) + 떠 있는 요소(absolute)" 한 쌍이다.
        이 조합은 앞으로 계속 나온다.

    [AI에게 물어보면 좋은 것]
      - "gap이랑 margin으로 간격 주는 거랑 뭐가 달라?"
      - "flex: 1은 정확히 무슨 뜻이야? flex-grow랑 관계가 뭐야?"
      - "absolute를 줬는데 엉뚱한 데로 가버려. 기준이 뭐야?"

    [AI에게 통째로 시키지 말 것]
      - "내비바 만들어줘." 한 줄이면 끝난다.
      - TODO 하나씩 채우고 브라우저에서 확인하면서 진행한다.

  [완성 조건]
    1. 로고가 왼쪽 끝, 메뉴와 종 아이콘이 오른쪽 끝에 있다.
    2. 스크롤을 내려도 헤더가 화면 맨 위에 붙어 따라온다.
    3. 종 아이콘 오른쪽 위에 빨간 배지가 겹쳐 보인다.
    4. 메뉴에 마우스를 올리면 배경이 부드럽게 바뀐다.
    5. 브라우저 폭을 줄여도 사이드바는 200px을 유지하고 본문만 줄어든다.
================================================================================
-->

<body>
    <header class="header">
        <div class="logo">MyApp</div>

        <div class="nav-right">
            <ul class="menu">
                <li><a href="#">홈</a></li>
                <li><a href="#">소개</a></li>
                <li><a href="#">문의</a></li>
            </ul>

            <div class="bell-wrap">
                <span class="bell">&#128276;</span>
                <span class="badge">3</span>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="side">
            사이드바<br>
            (200px 고정)
        </aside>

        <main class="main">
            <h2>본문 영역</h2>
            <p>남는 공간을 전부 차지해야 한다. 브라우저 폭을 줄여보면서 확인하자.</p>
            <div class="filler">스크롤 확인용 영역</div>
        </main>
    </div>
</body>
