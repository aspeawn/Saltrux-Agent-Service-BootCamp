<!--
================================================================================
 99. 종합 - 자기소개 페이지 스타일링

  [목표]
    - 지금까지 배운 CSS를 하나의 완결된 페이지에 통합 적용할 수 있다.
    - 외부 스타일 시트로 HTML과 CSS를 분리해 관리할 수 있다.
    - 구조가 잘 잡힌 HTML이 스타일링을 얼마나 쉽게 만드는지 체감한다.

  [유형]: 구현형 (종합) - 과제

  이 문제는 수업 시간에 풀지 않고 과제로 진행한다.

  ────────────────────────────────────────────────────────────────────────────
  [시작하기]

  1. HTML 과정의 99번 과제에서 만든 본인의 자기소개 페이지를 가져온다.
     (01_html/exercises/99_종합_문제.html 에 작성했던 그 결과물)

  2. 이 파일의 body 안에 그 HTML을 그대로 붙여넣는다.
     HTML은 되도록 고치지 않는다. 클래스 이름을 추가하는 정도만 허용한다.

  3. 같은 폴더에 99_종합_문제.css 파일을 새로 만들고 거기에 CSS를 작성한다.
     이 파일 위쪽의 link 태그가 이미 그 파일을 불러오도록 되어 있다.

  ★ HTML 99번을 완성하지 못했다면 01_html/exercises_answer/99_종합_답안.html 을 가져와도 된다.
  ────────────────────────────────────────────────────────────────────────────

  [요구 사항]
    아래 항목을 모두 반영한다. 색과 크기는 본인 취향대로 정한다.

    1. 기본 설정
       - CSS 파일 맨 위에 * { box-sizing: border-box; } 를 둔다.
       - body에 기본 글꼴, 배경색, 줄 간격(line-height)을 지정한다.
       - 전체 내용이 화면 가운데로 오게 하고 최대 너비를 800px 정도로 제한한다.
         (힌트: max-width와 margin: 0 auto)

    2. 헤더
       - 프로필 사진을 원형으로 만든다.
       - 이름과 한 줄 소개를 사진 옆에 가로로 배치한다. (flex)

    3. 목차
       - 목록 점을 없애고 가로로 나란히 배치한다. (flex + gap)
       - 스크롤해도 화면 위에 붙어 따라오게 한다. (sticky)
       - 링크에 hover 효과를 주고 transition으로 부드럽게 만든다.

    4. 기술 스택
       - dt(용어)와 dd(설명)의 모양을 구분한다. (굵기, 색, 여백)
       - 또는 grid로 용어와 설명을 2열로 나란히 배치해도 좋다.

    5. 학습 이력 표
       - border-collapse로 이중 테두리를 없앤다.
       - thead에 배경색을 준다.
       - 셀에 안쪽 여백을 준다.
       - 짝수 행에만 배경색을 준다. (힌트: :nth-child)

    6. 연락처 폼
       - label과 input을 세로로 정렬하고 간격을 정리한다.
       - input에 테두리, 안쪽 여백, 모서리 둥글기를 준다.
       - input이 포커스되면 테두리 색이 바뀌게 한다. (:focus)
       - 버튼에 배경색, 글자색, hover 효과를 준다.

    7. 반응형
       - 화면 폭 600px 이하일 때 헤더의 사진과 글자가 세로로 쌓이게 한다.
       - 목차도 좁은 화면에서 줄바꿈되게 한다. (flex-wrap)

  [자가 점검]
    제출 전에 아래를 직접 확인한다.
      [ ] CSS는 전부 별도 .css 파일에 있다. (style 태그나 style 속성을 쓰지 않았다)
      [ ] 브라우저 폭을 600px 이하로 줄여도 가로 스크롤이 생기지 않는다.
      [ ] 목차 링크를 누르면 해당 위치로 이동한다. (HTML 단계의 앵커가 살아 있다)
      [ ] 라벨 글자를 클릭하면 입력창에 커서가 간다. (HTML 단계의 연결이 살아 있다)
      [ ] !important를 한 번도 쓰지 않았다.
      [ ] F12에서 취소선이 그어진 규칙이 없다. (있다면 왜 졌는지 설명할 수 있어야 한다)

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 큰 틀부터 잡는다. body 폭 제한 -> 각 영역 -> 세부 요소 순서가 편하다.
      - 색은 2~3가지로 제한한다. 많이 쓸수록 정리되지 않은 느낌이 난다.

    [AI에게 물어보면 좋은 것]
      - 완성 후 "이 CSS에서 중복되는 부분을 줄일 수 있을까?"
      - "이 배치는 flex가 나아, grid가 나아?"
      - 안 되는 부분만 골라서 "이 부분이 이렇게 보이는데 왜 그럴까?"

    [AI에게 통째로 시키지 말 것]
      - 이 과제는 HTML과 CSS를 마무리하는 자리다.
        통째로 받으면 무엇을 모르는지 확인할 기회가 사라진다.
      - 막히는 항목만 골라서 물어본다.

  [마지막으로]
    작업하면서 이걸 느껴보자.
    HTML 단계에서 구조를 제대로 잡아두었다면, 이번 과제는 생각보다 수월하게 끝난다.
    반대로 div만 잔뜩 중첩해 놓았다면 선택자부터 꼬이기 시작한다.
    "구조를 먼저, 스타일은 나중에"가 왜 원칙인지 직접 겪어보는 것이 이 과제의 핵심이다.

    이 감각은 React에서 그대로 쓰인다.
    컴포넌트를 어떻게 나눌지는 결국 HTML 구조를 어떻게 잡느냐에서 결정되기 때문이다.
================================================================================
