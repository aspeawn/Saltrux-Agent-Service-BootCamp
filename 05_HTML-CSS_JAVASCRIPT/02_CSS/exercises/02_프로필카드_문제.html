<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ============================================================
           여기에만 CSS를 작성한다. 아래 body의 HTML은 수정하지 않는다.
           "어떤 태그를 쓸까"가 아니라 "어떤 속성으로 꾸밀까"에 집중하는 문제다.
           ============================================================ */

        /* TODO 1. 카드 전체 (.card)
           - 너비 360px
           - 안쪽 여백 20px
           - 테두리 1px 회색 실선
           - 모서리를 8px 둥글게
           - 배경색 흰색
           - 화면 가운데로 오게 한다. (힌트: margin의 auto 값) */


        /* TODO 2. 페이지 배경 (body)
           - 배경색을 연한 회색(#f0f0f0)으로
           - 기본 글꼴을 지정한다. (힌트: 맑은 고딕을 먼저, 없으면 sans-serif)
           - 위아래 여백 40px */


        /* TODO 3. 프로필 이미지 (.card img)
           - 너비 100px, 높이 100px
           - 완전한 원으로 만든다. (힌트: border-radius를 절반 이상으로)
           - 아래쪽 여백 10px */


        /* TODO 4. 이름 (.name)
           - 글자 크기 1.5rem
           - 굵게
           - 아래 여백을 4px로 줄인다. (h2의 기본 여백이 크다) */


        /* TODO 5. 직함 (.role)
           - 글자 크기 0.9rem
           - 글자색 회색(#777)
           - 모두 대문자로 보이게 한다. (힌트: text-transform)
           - 글자 사이 간격을 살짝 벌린다. (힌트: letter-spacing 1px) */


        /* TODO 6. 소개 문단 (.bio)
           - 줄 간격을 1.6으로
           - 글자색 #444
           - 양쪽 정렬 */


        /* TODO 7. 강조 표시 (.bio mark)
           - 형광펜 색을 기본 노랑 대신 연한 하늘색(#cfe8ff)으로 바꾼다. */


        /* TODO 8. 기술 목록 (.skills)
           - 목록 앞의 점을 네모(square)로 바꾼다.
           - 점이 글자 안쪽에 들어오게 한다. (힌트: list-style-position)
           - 왼쪽 안쪽 여백 20px */


        /* TODO 9. 구분선 (hr)
           - 테두리를 없애고 위쪽만 1px 점선으로 만든다.
           - 위아래 여백 16px */


        /* TODO 10. 배너 영역 (.banner)
           - 배경 이미지로 ../sample/image/city1.jpg 를 넣는다.
           - 이미지가 반복되지 않게 한다.
           - 영역을 꽉 채우도록 크기를 맞춘다. (힌트: background-size: cover)
           - 이미지의 가운데가 보이도록 위치를 잡는다.
           - 높이 120px, 아래 여백 16px
           - 글자색은 흰색, 가운데 정렬, 줄 높이 120px */
    </style>
    <title>[문제] 프로필 카드</title>
</head>

<!--
================================================================================
 02. 프로필 카드 - 스타일 속성 종합

  [목표]
    - 글꼴 관련 속성(font-family, font-size, font-weight)을 적용할 수 있다.
    - 텍스트 속성(text-transform, letter-spacing, text-decoration)을 적용할 수 있다.
    - 문단 속성(text-align, line-height)을 적용할 수 있다.
    - 목록 스타일(list-style-type, list-style-position)을 바꿀 수 있다.
    - 배경 속성(background-image, repeat, size, position)을 조합할 수 있다.

  [유형]: 구현형

  ────────────────────────────────────────────────────────────────────────────
  HTML은 이미 완성되어 있다. 건드리지 않는다.
  style 태그 안의 TODO 10개만 채우면 된다.

  CSS 수업에서는 "무슨 태그를 쓸까"가 아니라
  "이미 있는 구조를 어떻게 보이게 할까"가 주제다.
  ────────────────────────────────────────────────────────────────────────────

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 속성 이름이 기억나지 않으면 2~6번 시연 파일을 먼저 열어본다. 거기 다 있다.
      - 값을 바꿔가며 새로고침해본다. CSS는 눈으로 확인하면서 익히는 것이 가장 빠르다.

    [AI에게 물어보면 좋은 것]
      - "border-radius를 50%로 하는 거랑 100px로 하는 거랑 뭐가 달라?"
      - "background-size의 cover랑 contain은 어떻게 달라?"
      - "line-height를 1.6처럼 단위 없이 쓰는 이유가 뭐야?"

    [AI에게 통째로 시키지 말 것]
      - "프로필 카드 CSS 짜줘." 한 줄이면 10개가 한꺼번에 나온다.
      - TODO 하나씩 채우고, 막히는 것만 물어본다.

  [완성 조건]
    1. 카드가 화면 가운데에 있고 흰 배경에 둥근 모서리로 보인다.
    2. 프로필 이미지가 정확한 원으로 보인다.
    3. 직함이 대문자로, 글자 사이가 벌어져 보인다.
    4. 소개 문단의 강조 부분이 하늘색으로 칠해져 있다.
    5. 기술 목록의 점이 네모다.
    6. 배너에 도시 사진이 잘리지 않고 영역을 꽉 채운다.
================================================================================
-->

<body>
    <div class="card">
        <div class="banner">MY PROFILE</div>

        <img src="../sample/image/flower1.jpg" alt="프로필 사진">

        <h2 class="name">홍길동</h2>
        <p class="role">backend developer</p>

        <hr>

        <p class="bio">
            Java와 Spring으로 백엔드를 개발해왔습니다.
            요즘은 <mark>AI 서비스</mark> 개발로 영역을 넓히는 중이며,
            화면을 읽고 고칠 수 있는 만큼의 프론트엔드 기초를 쌓고 있습니다.
        </p>

        <hr>

        <h3>기술 스택</h3>
        <ul class="skills">
            <li>Java / Spring Boot</li>
            <li>MySQL</li>
            <li>Docker</li>
            <li>HTML / CSS (학습 중)</li>
        </ul>
    </div>
</body>

</html>
