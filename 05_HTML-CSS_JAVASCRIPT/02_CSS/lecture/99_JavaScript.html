<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button type="button" class="log-button">클릭</button>
    <!-- 자바스크립트 -->
    <script>
      console.log("log입니다!");

      const button = document.querySelector(".log-button");

      let count = 0;

      button.addEventListener("click", function () {
        count = count + 1;
        console.log("버튼이 클릭되었습니다 횟수 : " + count);
      });
    </script>
  </body>
</html>
