<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .contatiner {
        display: grid;
        border: 2px black;
        background: grey;
        gap: 10px;
        border-style: dashed;
        /* height: 600px; */
      }

      .item {
        background: greenyellow;
        color: black;
        padding: 15px;
        text-align: center;
      }

      /* 열의 개수와 너비를 정함 */
      .col-px {
        /* grid-template-columns: 100px 100px 100px; */
        grid-template-columns: 1fr 2fr 100px 1fr;
      }

      .row-fix {
        grid-template-rows: 1fr 1fr;
      }

      .layout {
        grid-template-columns: 200px 1fr;
        grid-template-rows: 60px 1fr 40px;
        grid-template-areas:
          "header header"
          "sidebar main"
          "footer footer";
        height: 300px;
      }

      .layout .head {
        grid-area: header;
        background: #1565c0;
      }
      .layout .side {
        grid-area: sidebar;
        background: #6a1b9a;
      }
      .layout .main {
        grid-area: main;
        background: #2e7d32;
      }
      .layout .foot {
        grid-area: footer;
        background: #455a64;
      }
    </style>
  </head>
  <body>
    <h1>grid 연습</h1>
    <div class="contatiner layout">
      <div class="item head">1</div>
      <div class="item sidebar">2</div>
      <div class="item footer">3</div>
      <div class="item main">4</div>
      <div class="item foot">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>
  </body>
</html>
