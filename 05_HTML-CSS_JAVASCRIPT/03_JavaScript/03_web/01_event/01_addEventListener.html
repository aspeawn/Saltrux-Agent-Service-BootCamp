<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01_이벤트 핸들러 등록</title>
    <style>
      #log {
        background: #f4f4f4;
        padding: 10px;
        min-height: 80px;
        font-family: monospace;
      }
    </style>
  </head>

  <body>
    <h1>01. 이벤트 핸들러 등록</h1>

    <button id="btn">눌러 보세요</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
      // $ : DOM 요소가 들어있는 변수라는 표시 (관례)
      const $log = document.getElementById("log");

      function log(message) {
        $log.insertAdjacentHTML("beforeend", `<div>${message}</div>`);
        console.log(message);
      }

      /***
       * 이벤트 핸들러
       * - 특정 이벤트가 발생하면 이 함수를 호출해달라 라고 맡기는 함수
       * - 브라우저가 호출함
       */

      // 1. 요소를 찾고
      const $btn = document.getElementById("btn");
      // log($btn);

      // 2. 이벤트를 등록한다!
      $btn.addEventListener('click', () => log("첫번째 핸들러"));
      $btn.addEventListener('click', () => log("두번째 핸들러"));
      // 옛날방식 : 한개만 등록 가능
      //   $btn.onclick = () => {
    //     log("첫번째 핸들러");
    //   };
    //   $btn.onclick = () => {
    //     log("두번째 핸들러");
    //   };

    $btn.addEventListener("click", () => log("첫번째 핸들러"));
    $btn.addEventListener("click", () => log("두번째 핸들러"));

    //   function handleMouser()
    </script>
  </body>
</html>
