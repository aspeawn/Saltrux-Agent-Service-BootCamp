<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[문제] 표 디버깅 - 성적표</title>
</head>

<!--
================================================================================
 03. 표 디버깅 - 깨진 성적표 고치기

  [목표]
    - 표의 각 행이 실제로 몇 칸인지 세어서 구조 오류를 찾아낼 수 있다.
    - colspan / rowspan이 어긋났을 때의 증상을 원인과 연결할 수 있다.

  [유형]: 디버깅형

  [증상 목록]
    아래 성적표는 5칸짜리 표여야 하는데 모양이 깨져 있다. 버그는 4개다.

    증상 1. "중간고사" 행만 오른쪽으로 한 칸 튀어나온다.
    증상 2. "기말고사" 행은 오른쪽 끝에 빈 칸이 하나 생긴다.
    증상 3. "평균" 행도 한 칸 튀어나오고, 이름 칸에 "김철수"가 두 번 나온다.
    증상 4. 합계 행이 두 칸밖에 없어서 "총점"이 표 너비를 덮지 못한다.

  [진단 요령]
    표가 깨졌을 때는 무조건 이것부터 한다.

      각 행의 실제 칸 수를 센다.
        - 일반 td/th        -> 1칸
        - colspan="N"       -> N칸
        - 위에서 rowspan으로 내려온 칸 -> 1칸 (이 행에는 태그가 없지만 자리를 차지한다!)

      모든 행의 합계가 같아야 한다. 다른 행이 곧 범인이다.

    이 표는 모든 행이 5칸이어야 한다. 아래에 직접 세어보자.

      제목 행     : ___ 칸
      중간고사 행 : ___ 칸
      기말고사 행 : ___ 칸
      평균 행     : ___ 칸
      이영희 행   : ___ 칸
      합계 행     : ___ 칸

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 위 칸 수 세기를 먼저 손으로 채운다. 이걸 하면 답이 거의 보인다.
      - 브라우저에서 열어놓고 눈으로 비교하면 훨씬 빠르다.

    [AI에게 물어볼 때는 이렇게]
      (나쁜 예) "표가 깨졌어. 고쳐줘."
      (좋은 예) "중간고사 행만 6칸이 되는데, colspan 값이 잘못된 걸까?"
         -> 칸 수를 세어서 말하면 AI가 정확히 그 지점만 본다.

  [완성 조건]
    1. 모든 행이 정확히 5칸이 되어 표가 반듯한 직사각형으로 보인다.
    2. 위 [진단 요령]의 칸 수 세기 빈칸을 채운다.
    3. 아래 [원인 기록란]에 4개의 원인을 각각 한 줄로 적는다.
================================================================================
-->

<body>
    <h1>성적표</h1>

    <table border="1">
        <caption><b>1학기 성적표</b></caption>

        <thead>
            <tr>
                <th>이름</th>
                <th>구분</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>JS</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="3">김철수</td>
                <td>중간고사</td>
                <td colspan="2">90</td>
                <td>85</td>
                <td>88</td>
            </tr>
            <tr>
                <td>기말고사</td>
                <td>95</td>
                <td>80</td>
            </tr>
            <tr>
                <td>김철수</td>
                <td>평균</td>
                <td>92</td>
                <td>82</td>
                <td>90</td>
            </tr>
            <tr>
                <td>이영희</td>
                <td>중간고사</td>
                <td>88</td>
                <td>91</td>
                <td>79</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>총점</td>
                <td>531</td>
            </tr>
        </tfoot>
    </table>

    <!--
    ================================================================================
     [원인 기록란] - 여기를 채우는 것이 이 문제의 핵심이다.

     증상 1의 원인 : colspan이 잘못 지정되어 HTML칸이 2칸을 먹어, CSS칸이 밀려서 오른쪽으로 튀어나왔다.
     증상 2의 원인 : td가 3칸만 있어서 오른쪽 끝에 빈 칸이 생겼다. colspan을 2로 지정해야 한다.
     증상 3의 원인 : rowspan이 3칸으로 지정되어 있었는데, 행 데이터가 5개가 추가되어 총 6개의 데이터가 한행에 들어와 오른쪽으로 튀어나왔다.
     증상 4의 원인 : colspan을 각각 2, 3으로 지정해 모두 덮을 수 있다.

     "고쳤다"로 끝내지 말고 반드시 원인을 문장으로 적어본다.
    ================================================================================
    -->
</body>

</html>
