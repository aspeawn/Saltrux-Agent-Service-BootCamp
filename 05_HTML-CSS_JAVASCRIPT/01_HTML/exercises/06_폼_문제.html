<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[문제] 폼 - 회원가입 양식</title>
</head>

<!--
================================================================================
 06. 폼 - 회원가입 양식 만들기

  [목표]
    - <form>의 기본 구조를 만들고 action, method 속성을 지정할 수 있다.
    - <input>의 다양한 type을 목적에 맞게 사용할 수 있다.
    - <label>과 입력 요소를 for / id로 올바르게 연결할 수 있다.
    - <fieldset>, <legend>로 폼을 구조화할 수 있다.
    - required로 필수 입력 항목을 지정할 수 있다.

  [유형]: 구현형

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 각 TODO에 어떤 태그가 필요할지 8_폼관련태그.html을 보면서 직접 찾아본다.
      - label과 input을 연결하는 방법은 반드시 스스로 손으로 써 본다. 뒤에서 계속 쓴다.

    [AI에게 물어보면 좋은 것]
      - "input type=email과 type=text는 실제로 뭐가 달라?"
      - "label의 for와 input의 id를 연결하면 어떤 이점이 있지?"
      - "radio 버튼들의 name을 동일하게 맞춰줘야 하는 이유가 뭐야?"

    [AI에게 통째로 시키지 말 것]
      - "예제를 풀어보려는데 회원가입 폼 만들어줘."라는 프롬프트 한 줄로 끝내는 것은 공부가 안된다.
      - 막히는 TODO 하나씩 물어보고, 받은 답을 읽고 이해한 뒤 직접 옮겨 적어보자.

  [완성 조건]
    1. 브라우저에서 열었을 때 모든 입력 항목에 라벨이 붙어 있다.
    2. 라벨 글자를 클릭하면 해당 입력창에 커서가 가거나 선택이 된다. (연결 확인용)
    3. 아이디와 비밀번호를 비우고 [가입하기]를 누르면 브라우저가 입력을 요구한다.
    4. 성별은 하나만 선택되고, 관심분야는 여러 개 선택된다.
================================================================================
-->

<body>
    <h1>회원가입</h1>

    <!-- TODO 1. form 태그로 아래 전체를 감싼다.
         - action은 "#", method는 "post"로 지정한다.
         - 왜 post인지 생각해보자. (힌트: 비밀번호가 주소창에 보이면 안 된다) -->
     <form action="#" method="post">

    <!-- TODO 2. fieldset과 legend로 "기본 정보" 영역을 만든다. -->
          <fieldset>
               <legend>필드 셋 제목 : 기본 정보</legend>
    <!-- TODO 3. 아이디 입력
         - type="text", name="userId", id="userId"
         - placeholder로 "아이디를 입력하세요" 안내를 넣는다.
         - 필수 입력으로 지정한다.
         - label의 for와 input의 id를 연결한다. -->
                    <label for="email">아이디 입력 : </label><input id="userId" type="text" name="userId" placeholder="아이디를 입력하세요.">

               
               

    <!-- TODO 4. 비밀번호 입력
         - type="password", name="userPwd", id="userPwd"
         - 필수 입력으로 지정한다. -->
         <p>
                    <label>비밀번호 입력 : </label><input id="userPwd" type="password" name="userPwd" required>
          </p>
    <!-- TODO 5. 이메일 입력
         - type="email", name="email", id="email"
         - type을 email로 하면 형식이 맞지 않을 때 브라우저가 걸러준다. -->
         <p>
                    <label>이메일 입력 : </label><input id="email" type="email" name="email">
              </fieldset> 
          </p>

    <!-- TODO 6. fieldset과 legend로 "추가 정보" 영역을 만든다. -->
     <form>
          <fieldset>
               <legend>필드 셋 제목 : 추가 정보</legend>

    <!-- TODO 7. 성별 (라디오 버튼 - 하나만 선택)
         - 남자 / 여자 두 개를 만든다.
         - 두 input의 name을 "gender"로 똑같이 맞춘다. (같아야 그룹이 되어 하나만 선택된다)
         - value는 각각 "M", "F"로 한다.
         - id는 서로 달라야 한다. label의 for로 각각 연결한다. -->
         <label>성별 : </label>
               <input id="male" type="radio" name="gender" value="M">
               <label for="male">남성</label>
               <input id="female" type="radio" name="gender" value="F">
               <label for="female">여성</label>
          
    <!-- TODO 8. 관심분야 (체크박스 - 여러 개 선택)
         - 프론트엔드 / 백엔드 / AI 세 개를 만든다.
         - name은 모두 "interest"로 맞춘다.
         - 기본으로 하나가 체크되어 있게 만든다. -->
         <p>
          <label>관심분야 : </label>
               <input id ="front" type="checkbox" name="interest" value="프론트엔드">
               <label for="front">프론트엔드</label>
               <input id ="backend" type="checkbox" name="interest" value="백엔드">
               <label for="backend">백엔드</label>
               <input id ="ai" type="checkbox" name="interest" value="AI">
               <label for="ai">AI</label>
               </p>
               

    <!-- TODO 9. 거주지역 (select 드롭다운)
         - 서울 / 경기 / 부산 / 기타 네 개의 option을 넣는다.
         - name="region", value는 각각 "seoul", "gyeonggi", "busan", "etc" -->
         <p>

          <label>거주지역 : </label>
               <select name="region">
                    <option value="seoul">서울</option>
                    <option value="gyeonggi">경기</option>
                    <option value="busan">부산</option>
                    <option value="etc">기타</option>
               </select>
         </p>      

    <!-- TODO 10. 자기소개 (textarea)
         - name="intro", 가로 40칸, 세로 5줄 정도로 지정한다. -->
          <label>자기소개 : </label>
          <p>
               <textarea name="intro" cols="40" rows="5"></textarea>
          </p>

    <!-- TODO 11. 버튼 두 개
         - [가입하기] : 폼을 전송하는 버튼
         - [다시 입력] : 폼을 초기화하는 버튼
         - button 태그를 쓴다면 type을 반드시 명시한다. 이유는 07번 문제에서 다룬다. -->

     </form>
</body>

</html>
