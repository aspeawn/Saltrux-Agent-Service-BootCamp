<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 관찰을 돕기 위한 최소한의 스타일이다. 이 CSS는 수정하지 않는다. */
        .mark {
            background: #cfe8ff;
            border: 1px solid #1565c0;
        }

        .sized {
            width: 300px;
            height: 60px;
            background: #ffe0b2;
            border: 1px solid #e65100;
        }
    </style>
    <title>[문제] 영역 - block과 inline 설명하기</title>
</head>

<!--
================================================================================
 04. 영역 - div와 span, block과 inline 설명하기

  [목표]
    - 블록 레벨 요소와 인라인 요소의 차이를 말로 설명할 수 있다.
    - div와 span을 언제 각각 쓰는지 판단할 수 있다.
    - 인라인 요소에 width/height가 먹지 않는 이유를 설명할 수 있다.

  [유형]: 해설형
    해설형 문제는 코드를 새로 짜보는 문제가 아니라 아래 코드를 브라우저에서 열어보고,
    왜 이렇게 렌더링 되었는지 그 원리를 주석으로 설명하는 문제다.
    잘 모르겠다면 AI에게 힌트를 물어봐도 되고, 모범 답안을 먼저 봐도 된다.

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 반드시 브라우저에서 먼저 열어보아 실제 어떻게 렌더링 되는지 확인한 후 시작한다.
      - F12 개발자 도구로 요소를 클릭하면 실제 크기가 보인다. 이걸로 확인한다.
      - 답을 적기 전에, 또는 답을 적으면서 내가 설명하기 편한 문장으로 풀어써보자.

    [AI에게 물어볼 때는 이렇게]
      - "인라인 요소는 width가 안 먹는다고 하는데, 내가 이해한 게 맞는지 봐줘.
        인라인은 글자처럼 취급돼서 내용만큼만 자리를 차지하기 때문이라고 이해했어."
      - AI에게 코드 생성 작업을 통으로 맡기더라도,
        사람이 코드를 읽고 무슨 일이 일어나는지 설명하고 이해할 수 있어야 고칠 방향 또한 지시할 수 있다.

  [완성 조건]
    - 아래 [관찰 1]~[관찰 5]의 빈칸을 채워본다.
    - 준비된 모범 답안을 확인하고, 내가 작성한 답안과 다르다면 이 또한 AI에게 물어보며 이해를 더해간다.
================================================================================
-->

<body>
    <h1>블록과 인라인</h1>

    <h3>관찰 1. div 세 개</h3>
    <div class="mark">첫 번째 div</div>
    <div class="mark">두 번째 div</div>
    <div class="mark">세 번째 div</div>

    <!--
      [관찰 1]
        Q1. div 세 개가 화면에 어떻게 배치되는가? (가로로? 세로로?)
            답 : 세로로 3개

        Q2. 글자는 짧은데 파란 배경은 왜 오른쪽 끝까지 늘어나 있는가?
            답 : 블록단위이기 때문임
    -->

    <hr>

    <h3>관찰 2. span 세 개</h3>
    <span class="mark">첫 번째 span</span>
    <span class="mark">두 번째 span</span>
    <span class="mark">세 번째 span</span>

    <!--
      [관찰 2]
        Q1. span 세 개는 어떻게 배치되는가? div와 무엇이 다른가?
            답 : 가로로 나열됨

        Q2. 배경색이 글자 크기만큼만 칠해지는 이유는 무엇인가?
            답 : 인라인으로 나열되기 때문임
    -->

    <hr>

    <h3>관찰 3. 같은 크기를 준 div와 span</h3>
    <p>아래 두 요소에는 똑같이 width: 300px, height: 60px을 주었다.</p>

    <div class="sized">크기를 준 div</div>
    <span class="sized">크기를 준 span</span>

    <!--
      [관찰 3]
        Q1. div는 지정한 크기대로 보이는가?
            답 : div는 지정한 크기대로 보임

        Q2. span은 지정한 크기대로 보이는가? 실제로 어떻게 보이는가?
            (F12로 클릭해서 실제 width 값을 확인해보자)
            답 :span은 지정한 크기대로 보이지않고 글자 크기로만 보임

        Q3. 왜 이런 차이가 생기는가? 자기 말로 설명해보자.
            답 : div는 블록 단위라서 그렇고, span은 인라인 단위라서 그렇다
    -->

    <hr>

    <h3>관찰 4. 문장 안에 섞어 쓰기</h3>
    <p>
        이 문장 중간에 <span class="mark">span</span>을 넣으면 흐름이 유지된다.
        하지만 이 문장 중간에
    <div class="mark">div</div>를 넣으면 어떻게 될까?
    </p>

    <!--
      [관찰 4]
        Q1. 문장 중간의 div는 문장을 어떻게 만드는가?
            답 : div는 블록 단위라서 문장이 끊어진다

        Q2. 이 관찰로부터, div와 span을 각각 언제 써야 한다고 정리할 수 있는가?
            답 : div는 블록 단위이기 때문에 주로 문단 단위일 때 사용하고, span은 인라인 단위이기 때문에 문장 단위로 사용한다.
    -->

    <hr>

    <h3>관찰 5. 정리</h3>

    <!--
      [관찰 5]
        Q1. 아래 표의 빈칸을 채워보자.

            구분                |    블록 레벨 요소    |   인라인 요소
            ────────────────────────────────────────────────────────
            줄바꿈              |     줄이 바뀜       |   줄이 바뀌지 않음
            차지하는 너비        |      적용됨         |   적용되지 않음
            width/height 적용   |      적용됨         |  적용되지 않음
            대표적인 태그        |      div           |     span

        Q2. 수업에서 배운 태그들을 블록과 인라인으로 나눠보자.
            (p, span, div, a, h1, img, ul, strong, li)

            블록   : p, div, h1, ul, li
            인라인 :  span, a, img, strong
    -->
</body>

</html>
