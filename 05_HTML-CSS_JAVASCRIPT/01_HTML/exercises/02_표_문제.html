<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[문제] 표 - 시간표 만들기</title>
</head>

<!--
================================================================================
 02. 표 - 주간 시간표 만들기

  [목표]
    - table, tr, th, td로 표의 기본 구조를 만들 수 있다.
    - thead, tbody, tfoot으로 표를 구조적으로 나눌 수 있다.
    - caption으로 표에 제목을 붙일 수 있다.
    - colspan과 rowspan으로 셀을 병합할 수 있다.

  [유형]: 구현형

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 병합은 종이에 먼저 그려보고 시작하는 게 훨씬 빠르다.
        표를 그린 뒤 합칠 칸을 색칠해 보면 colspan/rowspan 숫자가 바로 보인다.
      - 셀을 병합하면 그 줄의 td 개수가 줄어든다는 점을 기억한다. 이게 핵심이다.

    [AI에게 물어보면 좋은 것]
      - "colspan을 2로 줬는데 표가 한 칸 삐져나오는 이유가 뭐야?"
      - "thead, tbody, tfoot을 안 쓰고 tr만 써도 화면은 똑같은데 왜 나눠?"

    [AI에게 통째로 시키지 말 것]
      - "시간표 만들어줘." 한 줄이면 끝나버린다.
      - 병합 숫자는 반드시 직접 세어본다. 03번 디버깅 문제에서 이 능력을 쓴다.

  [완성 조건]
    1. 아래 [완성 예시]와 같은 모양으로 보인다.
    2. 표의 모든 줄에서 실제 칸 수가 5칸으로 맞는다. (삐져나오거나 모자란 칸이 없다)
    3. thead / tbody / tfoot이 모두 사용되었다.
================================================================================

  [완성 예시]

   ┌─────────────────────────────────────────────┐
   │            AI 서빙 과정 주간 시간표           │  <- caption
   ├────────┬────────┬────────┬────────┬────────┤
   │  교시  │  월    │  화    │  수    │  목    │  <- thead
   ├────────┼────────┴────────┼────────┼────────┤
   │  1교시 │      HTML       │  CSS   │  JS    │  <- HTML이 가로 2칸 (colspan)
   ├────────┼────────┬────────┼────────┼────────┤
   │  2교시 │  CSS   │  JS    │        │  JS    │
   ├────────┼────────┼────────┤ React  ├────────┤  <- React가 세로 2칸 (rowspan)
   │  3교시 │  JS    │ React  │        │ 프로젝트│
   ├────────┼────────┴────────┴────────┴────────┤
   │  비고  │        매일 9시 시작                │  <- tfoot, 가로 4칸
   └────────┴─────────────────────────────────────┘
================================================================================
-->

<body>

    <!-- TODO 1. table 태그를 만든다. border="1"을 주어 선이 보이게 한다.
         (원래 테두리는 CSS로 주는 것이 맞지만, 지금은 구조 확인이 목적이므로 border 속성을 쓴다) -->
        <table border="1">
          
        <!-- TODO 2. caption으로 표 제목 "AI 서빙 과정 주간 시간표"를 넣는다.
             caption은 table 태그 바로 다음에 와야 한다. -->
          <caption><b>AI 서빙 과정 주간 시간표</b></caption>

        <!-- TODO 3. thead를 만들고 그 안에 제목 행을 하나 넣는다.
             셀은 td가 아니라 th를 쓴다. (제목 셀이므로)
             내용 : 교시 / 월 / 화 / 수 / 목  -> 총 5칸 -->
          <thead>
              <tr>
                  <th>교시</th>
                  <th>월</th>
                  <th>화</th>
                  <th>수</th>
                  <th>목</th>
              </tr>
          </thead></td>


        <!-- TODO 4. tbody를 만들고 그 안에 3개의 행을 넣는다.

             [1교시 행]
               - 첫 칸은 th로 "1교시"
               - "HTML"이 월,화 두 칸을 차지해야 한다. -> colspan 사용
               - 그 다음 "CSS", "JS"
               - 힌트: 가로로 2칸을 합쳤으므로 이 행의 셀 개수는 5개가 아니라 4개다.

             [2교시 행]
               - 첫 칸은 th로 "2교시"
               - "CSS", "JS"
               - "React"가 2교시와 3교시 두 줄을 차지해야 한다. -> rowspan 사용
               - 마지막에 "JS"

             [3교시 행]
               - 첫 칸은 th로 "3교시"
               - "JS", "React(수업)"
               - 주의! 수요일 칸은 위에서 rowspan으로 이미 내려왔으므로 여기서는 쓰지 않는다.
                 이걸 또 쓰면 칸이 하나 밀려서 표가 깨진다.
               - 마지막에 "프로젝트" -->
        <tr>
               <th>1교시</th>
                <td colspan="2">HTML</td>
                <td>CSS</td>
                <td>JS</td>
        </tr>
        <tr>
                <th>2교시</th>
                  <td>CSS</td>
                  <td>JS</td>
                  <td rowspan="2">React</td>
                  <td>JS</td>
        </tr>
        <tr>
                <th>3교시</th>
                  <td>JS</td>
                  <td>React</td>
                  <td>프로젝트</td>
          </tr>

        <!-- TODO 5. tfoot을 만들고 행을 하나 넣는다.
             - 첫 칸은 th로 "비고"
             - "매일 9시 시작"이 나머지 4칸을 전부 차지해야 한다. -> colspan 사용 -->
        <tfoot>
            <tr>
                <th>비고</th>
                <td colspan="4">매일 9시 시작</td>
            </tr>
        </tfoot>
    </table>


</body>

</html>
