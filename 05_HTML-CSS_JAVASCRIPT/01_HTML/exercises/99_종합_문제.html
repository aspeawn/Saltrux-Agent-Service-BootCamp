    <title>[문제] 종합 - 자기소개 페이지</title>
</head>

<!--
================================================================================
 99. 종합 - 자기소개 페이지 만들기

  [목표]
    - 지금까지 배운 태그를 하나의 완결된 문서에 통합할 수 있다.
    - 스타일(CSS) 없이 구조(HTML)만으로 읽히는 문서를 만들 수 있다.

  [유형]: 구현형 (종합) - 과제

  이 문제는 수업 시간에 풀지 않고 과제로 진행한다. 넉넉히 시간을 들여 완성한다.

  ────────────────────────────────────────────────────────────────────────────
  이 문제는 CSS 과정으로 이어진다.

  여기서 만든 결과물을 CSS의 99번 예제에서 그대로 가져다 스타일링한다.
  그러니 지금은 "예쁘게"가 아니라 "구조가 올바르게"에만 집중한다.
  CSS는 한 줄도 쓰지 않는다. style 속성도 쓰지 않는다.

  구조가 잘 잡힌 문서는 CSS 없이 흑백으로 봐도 내용이 읽힌다.
  그것이 이 문제의 기준이다.
  ────────────────────────────────────────────────────────────────────────────

  [요구 사항]
    아래 6개 영역을 모두 포함한다. 내용은 본인 것으로 자유롭게 채운다.

    1. 머리말
       - 이름(h1), 한 줄 소개(p)
       - 프로필 사진 1장 (../sample/image 안의 아무 이미지나 사용)

    2. 목차
       - 아래 각 영역으로 이동하는 앵커 링크 목록

    3. 소개
       - 문단 2개 이상
       - 강조 태그를 적절히 사용 (strong, em, mark 중 2개 이상)

    4. 기술 스택
       - 설명 목록(dl/dt/dd)으로 기술명과 설명을 짝지어 정리
       - 최소 3개

    5. 학습 이력
       - 표(table)로 정리
       - thead와 tbody를 사용
       - caption으로 표 제목
       - 최소 3행
       - 셀 병합(colspan 또는 rowspan)을 최소 1회 사용

    6. 연락처
       - 이메일을 받을 수 있는 간단한 폼
         · 이름(text), 이메일(email), 메시지(textarea), 보내기 버튼
         · 모든 입력에 label을 for/id로 연결
         · 이름과 이메일은 필수 입력
       - 외부 링크 1개 이상 (GitHub 등, 새 탭에서 열리게)

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 코드를 쓰기 전에 종이나 메모장에 화면 구조를 먼저 그려본다.
        어떤 덩어리가 있고, 각 덩어리의 제목 단계(h1/h2/h3)는 무엇인지.
      - 각 영역마다 "이 내용에 맞는 태그가 뭐지?"를 스스로 먼저 정한다.

    [AI에게 물어보면 좋은 것]
      - 자기가 짠 구조를 보여주고 "제목 단계가 건너뛰지 않았는지 봐줘."
      - "이 내용은 ul이 맞아, dl이 맞아?"
      - 완성 후 "시맨틱 관점에서 개선할 부분이 있을까?"

    [AI에게 통째로 시키지 말 것]
      - 막히는 영역만 골라서 물어본다.

  [완성 조건]
    1. CSS 없이 흑백 상태로 봐도 문서의 구조와 내용이 읽힌다.
    2. 개발자 도구에서 제목 단계가 h1 > h2 > h3 순서로 건너뛰지 않는다.
    3. 모든 img에 의미 있는 alt가 있다.
    4. 모든 입력 요소에 label이 연결되어 있다. (라벨 글자 클릭으로 확인)
    5. 목차 링크가 모두 정상 동작한다.
    6. 표의 모든 행의 칸 수가 일치한다.

  [자가 점검]
    제출 전에 아래를 직접 확인한다.
      [ ] style 속성이나 style 태그를 쓰지 않았다.
      [ ] b/i 대신 strong/em을 썼다. (의미가 있는 쪽)
      [ ] alt에 "이미지", "사진" 같은 무의미한 값을 쓰지 않았다.
      [ ] form 안의 button에 type을 명시했다.
      [ ] 라벨 글자를 클릭했을 때 입력창에 커서가 간다.
================================================================================
-->

<body>

    <!-- 여기부터 자유롭게 작성한다.
         위 [요구 사항]의 6개 영역 순서를 따르면 된다.
         구조가 막힐 때는 앞선 예제들을 참고한다.
           - 글자와 목록   : 01번 문제
           - 표            : 02번 문제
           - 이미지와 링크 : 05번 문제
           - 폼            : 06번 문제 -->
    <h1>자기소개 페이지</h1>
      <p>안녕하세요. 저는 AI 에이전트 개발에 관심이 많은 학생입니다.</p>
        <a href="../lecture/sample/image/flower1.jpg" target="_blank">
          <img src="../lecture/sample/image/flower1.jpg" alt="자기소개 페이지의 프로필 사진" width="300">
        </a>
        


</body>
