spring:
  application:
    name: chap00-jpa-intro
  datasource:
    url: jdbc:mysql://localhost:3306/menudb
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # ddl-auto
      # - none : 스키마(데이터베이스) 변경하지 않음
      # - validate : 엔티티와 테이블 구조가 일치하는지 검사
      # - update : 엔티티 변경사항을 기존 테이블에 반영 (기존 테잉블은 삭제)
      # - create : 기존테이블을 삭제하고 엔티티에 정의한대로 다시 생성
      # - create-drop : 실행할 때 생성하고, 어플리케이션 종료시 삭제
      ddl-auto: none
  properties:
    hibernate:
      format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace